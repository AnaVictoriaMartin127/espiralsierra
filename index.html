<title>Saw Spiral</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: a Max-style patcher sheet; one slim toolbar on top, the spiral patch fills the rest. */
:root {
  --bg: #f6f6f4;
  --sheet: #fbfbfa;
  --fg: #222321;
  --muted: #6d6e6a;
  --cord: #8b8c88;
  --box-bg: #ffffff;
  --box-line: #9b9c98;
  --num-bg: #2c2d2b;
  --num-fg: #f1f1ee;
  --flash: #151614;
  --signal: #d8231f;
  --ui-line: #d9d9d5;
  --font-ui: "IBM Plex Sans", "Helvetica Neue", Arial, sans-serif;
  --font-num: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #1f2022; --sheet: #2a2b2e; --fg: #e7e7e4; --muted: #a2a39f; --cord: #9a9c9f;
  --box-bg: #3a3b3f; --box-line: #6c6e72; --num-bg: #18191a; --num-fg: #f1f1ee;
  --flash: #f4f4f1; --signal: #ff4a3d; --ui-line: #3d3e42; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #1f2022; --sheet: #2a2b2e; --fg: #e7e7e4; --muted: #a2a39f; --cord: #9a9c9f;
  --box-bg: #3a3b3f; --box-line: #6c6e72; --num-bg: #18191a; --num-fg: #f1f1ee;
  --flash: #f4f4f1; --signal: #ff4a3d; --ui-line: #3d3e42; color-scheme: dark; }

html, body { height: 100%; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--font-ui);
  display: flex; flex-direction: column; gap: 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px; box-sizing: border-box;
}
.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; }
.bar h1 { font-size: 15px; font-weight: 700; margin: 0; letter-spacing: .02em; }
.bar h1 span { color: var(--muted); font-weight: 400; }
button {
  font: 600 13px var(--font-ui); color: var(--fg); background: var(--sheet);
  border: 1px solid var(--box-line); border-radius: 4px; padding: 6px 12px; cursor: pointer;
}
button.primary { background: var(--num-bg); color: var(--num-fg); border-color: var(--num-bg); min-width: 84px; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--signal); outline-offset: 2px; }
label { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
select { font: 13px var(--font-ui); color: var(--fg); background: var(--sheet); border: 1px solid var(--box-line); border-radius: 4px; padding: 4px 6px; }
input[type=range] { width: 96px; accent-color: var(--signal); }
.val { font-family: var(--font-num); font-size: 11px; color: var(--fg); min-width: 4.5ch; font-variant-numeric: tabular-nums; }
.stage {
  flex: 1; min-height: 0; position: relative; background: var(--sheet);
  border: 1px solid var(--ui-line); border-radius: 6px; overflow: hidden;
}
canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; display: block; }
.hint { font-size: 12px; color: var(--muted); margin: 0; }
</style>

<div class="bar">
  <h1>Saw Spiral <span>· a pulse travels through a spiral of oscillators</span></h1>
  <button id="play" class="primary">▶ Play</button>
  <label for="step">Step <input id="step" type="range" min="70" max="400" value="180"><span class="val" id="stepv">180 ms</span></label>
  <label for="vol">Volume <input id="vol" type="range" min="0" max="100" value="60"></label>
  <label for="sound">Sound <select id="sound"></select></label>
  <label for="loop"><input id="loop" type="checkbox" checked> Loop</label>
  <button id="shuffle">Shuffle notes</button>
</div>
<div class="stage"><canvas id="cv" aria-label="Spiral patch of saw oscillator nodes"></canvas></div>
<p class="hint">Click any ○ to fire the chain from there. Drag a number up or down to retune it (values are Hz). The ⊠ toggle in the center is the start gate.</p>

<script>
(() => {
  const W = 720, H = 900;               // logical patch size (same aspect as the reel)
  const cv = document.getElementById('cv');
  const g = cv.getContext('2d');

  // ---------- seeded random ----------
  let seed = 7;
  const rnd = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };

  // ---------- build the spiral ----------
  const SCALE = [107, 120, 135, 150, 160, 180, 200, 240, 270, 300, 320, 360, 480]; // just-ish scale on 120 Hz
  const cx = 362, cy = 505, ry = 1.1;
  const r0 = 58, rEnd = 322, turns = 4, spacing = 57;
  const thEnd = 1.5 * Math.PI, th0 = thEnd - turns * 2 * Math.PI;
  const b = (rEnd - r0) / (thEnd - th0);
  const nodes = [];
  {
    let th = th0;
    while (th <= thEnd + 1e-6) {
      const r = r0 + b * (th - th0);
      nodes.push({ x: cx + r * Math.cos(th), y: cy + r * Math.sin(th) * ry, th, out: [], flash: -1, hz: 200 });
      th += spacing / r;             // step by roughly equal arc length
    }
  }
  const spiralLast = nodes.length - 1;
  // fan of leaves above the outermost node
  const top = nodes[spiralLast];
  const fan = [[-140, -55], [-75, -112], [-8, -142], [55, -128], [118, -78], [175, -30]];
  for (const [dx, dy] of fan) {
    const n = { x: top.x + dx, y: top.y + dy, out: [], flash: -1, hz: 200, leaf: true };
    nodes.push(n); top.out.push(nodes.length - 1);
  }
  for (let i = 0; i < spiralLast; i++) nodes[i].out.push(i + 1);

  // a few forks that jump one ring outward, so pulses multiply like in the reel
  const ringOut = i => {
    const target = nodes[i].th + 2 * Math.PI; let best = -1, bd = 1e9;
    for (let j = i + 1; j <= spiralLast; j++) { const d = Math.abs(nodes[j].th - target); if (d < bd) { bd = d; best = j; } }
    return best;
  };
  for (const f of [0.2, 0.42, 0.6]) {
    const i = Math.round(spiralLast * f), j = ringOut(i);
    if (j > 0) nodes[i].out.push(j);
  }
  const gate = { x: cx + 6, y: cy + 28, on: false, out: [0, ringOut(3)] };

  function assignNotes() {
    let deg = 5;
    for (let i = 0; i < nodes.length; i++) {
      if (nodes[i].leaf) { nodes[i].hz = SCALE[[1, 4, 6, 7, 8, 12][(i - spiralLast - 1) % 6]]; continue; }
      if (i > 0 && rnd() < 0.42) { nodes[i].hz = nodes[i - 1].hz; continue; } // runs of repeated pitch
      deg = Math.max(0, Math.min(10, deg + Math.round((rnd() - 0.5) * 4.4 + (5 - deg) * 0.25)));
      nodes[i].hz = SCALE[deg];
    }
  }
  assignNotes();

  // node geometry
  const BANG_R = 9;
  const numBox = n => ({ x: n.x + 13, y: n.y - 8, w: 8 + 7 * String(n.hz).length + 8, h: 14 });
  let tag = 'bell';
  const sawBox = n => ({ x: n.x - 13, y: n.y + 14, w: 16 + 5.2 * tag.length, h: 14 });
  const outlet = n => { const s = sawBox(n); return { x: s.x + 3, y: s.y + s.h }; };
  const inlet = n => ({ x: n.x, y: n.y - BANG_R });

  function bez(p0, p1) {
    const d = Math.hypot(p1.x - p0.x, p1.y - p0.y), sag = Math.min(60, d * 0.45);
    return [p0, { x: p0.x, y: p0.y + sag }, { x: p1.x, y: p1.y - sag }, p1];
  }
  const bezAt = (c, t) => {
    const u = 1 - t;
    return {
      x: u*u*u*c[0].x + 3*u*u*t*c[1].x + 3*u*t*t*c[2].x + t*t*t*c[3].x,
      y: u*u*u*c[0].y + 3*u*u*t*c[1].y + 3*u*t*t*c[2].y + t*t*t*c[3].y,
    };
  };

  // ---------- audio ----------
  let ac = null, master = null;
  function ensureAudio() {
    if (ac) return;
    if (window.__vt != null) { ac = { get currentTime() { return window.__vt; }, resume() {} }; return; }
    ac = new (window.AudioContext || window.webkitAudioContext)();
    const comp = ac.createDynamicsCompressor();
    comp.threshold.value = -18; comp.ratio.value = 4;
    master = ac.createGain(); master.gain.value = vol();
    master.connect(comp).connect(ac.destination);
  }
  const vol = () => (document.getElementById('vol').value / 100) ** 2 * 0.5;
  // ---------- voices ----------
  const SOUNDS = {
    softbell:{ label: 'Soft bell', tag: 'bell' },
    saw:     { label: 'Saw (original)', tag: 'saw' },
    square:  { label: 'Square', tag: 'sqr' },
    pluck:   { label: 'Pluck', tag: 'pluck' },
    marimba: { label: 'Marimba', tag: 'mrmb' },
    glass:   { label: 'Glass bell', tag: 'glass' },
    fm:      { label: 'FM chime', tag: 'fm' },
    sine:    { label: 'Sine blip', tag: 'sin' },
  };
  function voice(ac, dest, kind, hz, t) {
    const env = (peak, att, dec) => {
      const a = ac.createGain();
      a.gain.setValueAtTime(0.0001, t);
      a.gain.exponentialRampToValueAtTime(peak, t + att);
      a.gain.exponentialRampToValueAtTime(0.0006, t + dec);
      a.connect(dest); return a;
    };
    const osc = (type, f, into, t1) => {
      const o = ac.createOscillator(); o.type = type; o.frequency.value = f;
      o.connect(into); o.start(t); o.stop(t1); return o;
    };
    const lp = (f0, f1, dt, q, into) => {
      const f = ac.createBiquadFilter(); f.type = 'lowpass'; f.Q.value = q;
      f.frequency.setValueAtTime(f0, t); f.frequency.exponentialRampToValueAtTime(f1, t + dt);
      f.connect(into); return f;
    };
    if (kind === 'softbell') {
      osc('sine', hz * 2, env(0.16, 0.012, 1.5), t + 1.55);
      osc('sine', hz * 4.0, env(0.035, 0.01, 0.7), t + 0.75);
      osc('sine', hz * 5.52, env(0.018, 0.008, 0.35), t + 0.4);
    } else if (kind === 'square') {
      osc('square', hz, lp(2400, 400, 0.25, 1, env(0.2, 0.004, 0.32)), t + 0.36);
    } else if (kind === 'pluck') {
      const a = env(0.36, 0.002, 0.55), f = lp(7000, 260, 0.12, 4, a);
      osc('sawtooth', hz, f, t + 0.6); osc('triangle', hz * 2, f, t + 0.6);
    } else if (kind === 'marimba') {
      osc('sine', hz * 2, env(0.42, 0.003, 0.5), t + 0.55);
      osc('sine', hz * 8, env(0.12, 0.002, 0.06), t + 0.1);
    } else if (kind === 'glass') {
      osc('sine', hz * 2, env(0.28, 0.004, 1.1), t + 1.15);
      osc('sine', hz * 5.52, env(0.08, 0.003, 0.5), t + 0.55);
      osc('sine', hz * 8.4, env(0.04, 0.002, 0.25), t + 0.3);
    } else if (kind === 'fm') {
      const a = env(0.3, 0.003, 0.8), c = osc('sine', hz * 2, a, t + 0.85);
      const m = ac.createOscillator(), mg = ac.createGain();
      m.frequency.value = hz * 2 * 3.5;
      mg.gain.setValueAtTime(hz * 6, t); mg.gain.exponentialRampToValueAtTime(1, t + 0.6);
      m.connect(mg).connect(c.frequency); m.start(t); m.stop(t + 0.85);
    } else if (kind === 'sine') {
      osc('sine', hz * 2, env(0.4, 0.004, 0.22), t + 0.25);
    } else {
      osc('sawtooth', hz, lp(3200, 500, 0.3, 2, env(0.32, 0.006, 0.38)), t + 0.42);
    }
  }
  const sound = () => document.getElementById('sound').value;
  function saw(hz, t) {
    if (window.__log) { window.__log.push([hz, t]); return; }
    voice(ac, master, sound(), hz, t);
  }

  // ---------- scheduler: pulses are events in audio time ----------
  const MAX_PULSES = 12;
  let events = [];       // {t, node, from}
  let travels = [];      // cords currently carrying a pulse: {c, t0, t1}
  let running = false, lastFire = 0;
  const stepS = () => document.getElementById('step').value / 1000;
  const now = () => (ac ? ac.currentTime : performance.now() / 1000);

  function fire(i, t) { if (events.length < MAX_PULSES) events.push({ t, node: i }); }
  function startFromGate() {
    const t = now() + 0.05;
    gate.flashT = t;
    for (const i of gate.out) {
      fire(i, t + stepS());
      travels.push({ c: bez({ x: gate.x - 9, y: gate.y + 22 }, inlet(nodes[i])), t0: t, t1: t + stepS() });
    }
  }
  function tick() {
    if (ac) {
      const horizon = ac.currentTime + 0.12;
      events.sort((a, b) => a.t - b.t);
      while (events.length && events[0].t <= horizon) {
        const e = events.shift(), n = nodes[e.node];
        saw(n.hz, e.t); n.flash = e.t; lastFire = e.t;
        const st = stepS();
        for (const j of n.out) {
          fire(j, e.t + st);
          travels.push({ c: bez(outlet(n), inlet(nodes[j])), t0: e.t, t1: e.t + st });
        }
      }
      if (running && gate.on && !events.length && ac.currentTime > lastFire + 0.5) {
        if (document.getElementById('loop').checked) startFromGate(); else setRunning(false);
      }
    }
  }
  function scheduler() { tick(); setTimeout(scheduler, 25); }
  scheduler();

  function setRunning(on) {
    running = on; gate.on = on;
    const btn = document.getElementById('play');
    btn.textContent = on ? '■ Stop' : '▶ Play';
    if (on) { ensureAudio(); ac.resume(); startFromGate(); }
    else { events = []; travels = []; }
  }

  // ---------- drawing ----------
  let view = { s: 1, ox: 0, oy: 0 }, col = {};
  const readColors = () => {
    const cs = getComputedStyle(document.documentElement);
    for (const k of ['sheet', 'fg', 'cord', 'box-bg', 'box-line', 'num-bg', 'num-fg', 'flash', 'signal', 'muted'])
      col[k] = cs.getPropertyValue('--' + k).trim();
  };
  readColors();
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', readColors);
  new MutationObserver(readColors).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

  function resize() {
    const r = cv.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
    cv.width = Math.round(r.width * dpr); cv.height = Math.round(r.height * dpr);
    const s = Math.min(r.width / W, r.height / H);
    view = { s, ox: (r.width - W * s) / 2, oy: (r.height - H * s) / 2, dpr };
  }
  new ResizeObserver(() => { if (!window.__fixed) resize(); }).observe(cv); resize();
  window.__saw = { nodes, voice, sound, tick, render, setRunning, setSize(w, h) { window.__fixed = true; cv.width = w; cv.height = h; const s = Math.min(w / W, h / H); view = { s, ox: (w - W * s) / 2, oy: (h - H * s) / 2, dpr: 1 }; } };

  function cord(c, w) {
    g.beginPath(); g.moveTo(c[0].x, c[0].y);
    g.bezierCurveTo(c[1].x, c[1].y, c[2].x, c[2].y, c[3].x, c[3].y);
    g.lineWidth = w; g.stroke();
  }
  function roundRect(x, y, w, h, r) { g.beginPath(); g.roundRect ? g.roundRect(x, y, w, h, r) : g.rect(x, y, w, h); }

  function render() {
    const t = now();
    g.setTransform(view.dpr, 0, 0, view.dpr, 0, 0);
    g.fillStyle = col.sheet; g.fillRect(0, 0, cv.width, cv.height);
    g.setTransform(view.dpr * view.s, 0, 0, view.dpr * view.s, view.dpr * view.ox, view.dpr * view.oy);

    // cords
    g.strokeStyle = col.cord; g.lineCap = 'round';
    for (const n of nodes) for (const j of n.out) cord(bez(outlet(n), inlet(nodes[j])), 1.6);
    for (const i of gate.out) cord(bez({ x: gate.x - 9, y: gate.y + 22 }, inlet(nodes[i])), 1.6);
    for (const n of nodes) {           // short internal cords: bang → p saw, number → p saw
      const s = sawBox(n), nb = numBox(n);
      g.beginPath(); g.moveTo(n.x - 2, n.y + BANG_R); g.lineTo(s.x + 3, s.y);
      g.moveTo(nb.x + 3, nb.y + nb.h); g.quadraticCurveTo(nb.x, s.y - 2, s.x + s.w - 3, s.y);
      g.lineWidth = 1.2; g.stroke();
    }

    // traveling pulses
    travels = travels.filter(p => t < p.t1);
    g.fillStyle = col.signal; g.strokeStyle = col.signal;
    for (const p of travels) {
      if (t < p.t0) continue;
      cord(p.c, 2.2);
      const q = bezAt(p.c, (t - p.t0) / (p.t1 - p.t0));
      g.beginPath(); g.arc(q.x, q.y, 3.2, 0, 7); g.fill();
    }

    g.textBaseline = 'middle';
    for (const n of nodes) {
      const lit = n.flash >= 0 && t >= n.flash && t - n.flash < 0.16;
      // bang
      g.beginPath(); g.arc(n.x, n.y, BANG_R, 0, 7);
      g.fillStyle = col['box-bg']; g.fill();
      g.lineWidth = 2.2; g.strokeStyle = lit ? col.flash : col['box-line']; g.stroke();
      if (lit) { g.beginPath(); g.arc(n.x, n.y, BANG_R - 3.6, 0, 7); g.fillStyle = col.flash; g.fill(); }
      // number box
      const nb = numBox(n);
      roundRect(nb.x, nb.y, nb.w, nb.h, 2); g.fillStyle = col['num-bg']; g.fill();
      g.fillStyle = n === dragNode ? col.signal : col['num-fg'];
      g.font = '500 9px IBM Plex Mono, monospace';
      g.fillText('▸' + n.hz, nb.x + 3, nb.y + nb.h / 2 + 0.5);
      // p saw box
      const s = sawBox(n);
      roundRect(s.x, s.y, s.w, s.h, 2); g.fillStyle = col['box-bg']; g.fill();
      g.lineWidth = 1; g.strokeStyle = col['box-line']; g.stroke();
      if (lit) { g.fillStyle = col.signal; g.fillRect(s.x + 1, s.y + 1, 3, s.h - 2); }
      g.fillStyle = col.fg; g.font = '9px IBM Plex Sans, Arial, sans-serif';
      g.fillText('p ' + tag, s.x + 5, s.y + s.h / 2 + 0.5);
    }

    // gate: toggle + "gate" box
    g.lineWidth = 1.2; g.strokeStyle = col['box-line'];
    roundRect(gate.x - 8, gate.y - 8, 16, 16, 2); g.fillStyle = col['box-bg']; g.fill(); g.stroke();
    if (gate.on) {
      g.strokeStyle = col.fg; g.lineWidth = 1.8; g.beginPath();
      g.moveTo(gate.x - 4, gate.y - 4); g.lineTo(gate.x + 4, gate.y + 4);
      g.moveTo(gate.x + 4, gate.y - 4); g.lineTo(gate.x - 4, gate.y + 4); g.stroke();
    }
    g.strokeStyle = col['box-line']; g.lineWidth = 1;
    roundRect(gate.x - 13, gate.y + 10, 26, 13, 2); g.fillStyle = col['box-bg']; g.fill(); g.stroke();
    g.fillStyle = col.fg; g.font = '9px IBM Plex Sans, Arial, sans-serif'; g.fillText('gate', gate.x - 9, gate.y + 17);

  }
  function draw() { render(); requestAnimationFrame(draw); }

  // ---------- interaction ----------
  let dragNode = null, dragY = 0, dragHz = 0;
  const toPatch = e => {
    const r = cv.getBoundingClientRect();
    return { x: (e.clientX - r.left - view.ox) / view.s, y: (e.clientY - r.top - view.oy) / view.s };
  };
  const inBox = (p, b, pad = 3) => p.x >= b.x - pad && p.x <= b.x + b.w + pad && p.y >= b.y - pad && p.y <= b.y + b.h + pad;
  function hit(p) {
    if (Math.abs(p.x - gate.x) < 13 && Math.abs(p.y - gate.y) < 13) return { kind: 'gate' };
    for (let i = 0; i < nodes.length; i++) {
      const n = nodes[i];
      if (inBox(p, numBox(n))) return { kind: 'num', i };
      if (Math.hypot(p.x - n.x, p.y - n.y) < BANG_R + 4 || inBox(p, sawBox(n))) return { kind: 'bang', i };
    }
    return null;
  }
  cv.addEventListener('pointerdown', e => {
    const h = hit(toPatch(e)); if (!h) return;
    if (h.kind === 'gate') { setRunning(!running); return; }
    ensureAudio(); ac.resume();
    if (h.kind === 'bang') { fire(h.i, ac.currentTime + 0.02); return; }
    dragNode = nodes[h.i]; dragY = e.clientY; dragHz = dragNode.hz;
    cv.setPointerCapture(e.pointerId);
  });
  cv.addEventListener('pointermove', e => {
    if (dragNode) {
      dragNode.hz = Math.max(40, Math.min(1200, Math.round(dragHz + (dragY - e.clientY) * 2)));
      cv.style.cursor = 'ns-resize'; return;
    }
    const h = hit(toPatch(e));
    cv.style.cursor = !h ? 'default' : h.kind === 'num' ? 'ns-resize' : 'pointer';
  });
  const endDrag = () => {
    if (dragNode && ac) saw(dragNode.hz, ac.currentTime + 0.01);
    dragNode = null;
  };
  cv.addEventListener('pointerup', endDrag);
  cv.addEventListener('pointercancel', () => { dragNode = null; });

  const sel = document.getElementById('sound');
  for (const [k, v] of Object.entries(SOUNDS)) sel.add(new Option(v.label, k));
  sel.addEventListener('change', () => { tag = SOUNDS[sel.value].tag; if (ac && !running) saw(200, ac.currentTime + 0.01); });
  document.getElementById('play').addEventListener('click', () => setRunning(!running));
  document.getElementById('step').addEventListener('input', e => {
    document.getElementById('stepv').textContent = e.target.value + ' ms';
  });
  document.getElementById('vol').addEventListener('input', () => { if (master) master.gain.value = vol(); });
  document.getElementById('shuffle').addEventListener('click', () => { seed = Math.floor(Math.random() * 1e6) + 1; assignNotes(); });

  requestAnimationFrame(draw);
})();
</script>
